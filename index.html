<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clarity — Markdown Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        :root {
            --outline-width: 280px;
        }

        /* Light theme */
        :root, [data-theme="light"] {
            --bg-primary: #fafaf9;
            --bg-secondary: #f5f5f4;
            --bg-tertiary: #e7e5e4;
            --text-primary: #1c1917;
            --text-secondary: #57534e;
            --text-tertiary: #a8a29e;
            --accent: #b45309;
            --accent-soft: #fef3c7;
            --border: #e7e5e4;
            --shadow: rgba(28, 25, 23, 0.05);
            --code-bg: #292524;
            --code-text: #fafaf9;
        }

        /* Dark theme */
        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #232323;
            --bg-tertiary: #2e2e2e;
            --text-primary: #e8e6e3;
            --text-secondary: #a8a29e;
            --text-tertiary: #6b6560;
            --accent: #e5a83b;
            --accent-soft: rgba(229, 168, 59, 0.1);
            --border: #333333;
            --shadow: rgba(0, 0, 0, 0.3);
            --code-bg: #111111;
            --code-text: #e8e6e3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Layout */
        .app {
            display: grid;
            grid-template-columns: var(--outline-width) 1fr;
            min-height: 100vh;
            transition: grid-template-columns 0.3s ease;
        }

        .app.outline-collapsed {
            grid-template-columns: 0 1fr;
        }

        /* Sidebar / Outline Panel */
        .outline-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .app.outline-collapsed .outline-panel {
            transform: translateX(-100%);
            opacity: 0;
        }

        .outline-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border);
        }

        .outline-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .outline-content {
            padding: 16px 0;
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .outline-content::-webkit-scrollbar {
            width: 4px;
        }

        .outline-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .outline-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .outline-item {
            display: block;
            padding: 8px 24px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .outline-item:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .outline-item.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: var(--accent-soft);
        }

        .outline-item.h2 { padding-left: 24px; }
        .outline-item.h3 { padding-left: 40px; font-size: 12px; }
        .outline-item.h4 { padding-left: 56px; font-size: 12px; color: var(--text-tertiary); }
        .outline-item.h5 { padding-left: 72px; font-size: 11px; color: var(--text-tertiary); }
        .outline-item.h6 { padding-left: 88px; font-size: 11px; color: var(--text-tertiary); }

        /* Main Content Area */
        .main-content {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-width: 0;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 48px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 16px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }

        .toggle-outline {
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .toggle-outline:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .toggle-outline svg {
            width: 18px;
            height: 18px;
        }

        .document-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-input-wrapper {
            position: relative;
            flex-shrink: 0;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .open-file-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .open-file-btn:hover {
            background: var(--accent);
        }

        .open-file-btn svg {
            width: 16px;
            height: 16px;
        }

        .open-file-btn span {
            display: inline;
        }

        .export-pdf-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .export-pdf-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }

        .export-pdf-btn svg {
            width: 16px;
            height: 16px;
        }

        .export-pdf-btn span {
            display: inline;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        /* Reader Area */
        .reader-container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 60px 48px 120px;
            width: 100%;
            max-width: 100%;
        }

        .reader {
            width: 100%;
            max-width: 720px;
            min-width: 0;
        }

        /* Welcome State */
        .welcome-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 40px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--bg-secondary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
        }

        .welcome-icon svg {
            width: 40px;
            height: 40px;
            color: var(--text-tertiary);
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            max-width: 400px;
            line-height: 1.6;
        }

        .drop-zone {
            width: 100%;
            max-width: 400px;
            padding: 48px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .drop-zone-text {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .drop-zone-text strong {
            color: var(--accent);
        }

        /* Markdown Content Styles */
        .markdown-content {
            animation: contentFadeIn 0.5s ease;
            width: 100%;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
        }

        @keyframes contentFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            color: var(--text-primary);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.3;
            scroll-margin-top: 100px;
            font-weight: 600;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .markdown-content h1 {
            font-size: 2.2em;
            margin-top: 0;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content h2 {
            font-size: 1.6em;
        }

        .markdown-content h3 {
            font-size: 1.3em;
        }

        .markdown-content h4 {
            font-size: 1.1em;
        }

        .markdown-content h5 {
            font-size: 1em;
        }

        .markdown-content h6 {
            font-size: 0.9em;
            color: var(--text-secondary);
        }

        .markdown-content p {
            margin-bottom: 1.25em;
        }

        .markdown-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: opacity 0.2s ease;
        }

        .markdown-content a:hover {
            opacity: 0.7;
        }

        .markdown-content strong {
            font-weight: 600;
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1.25em;
            padding-left: 1.5em;
        }

        .markdown-content li {
            margin-bottom: 0.5em;
        }

        .markdown-content li > ul,
        .markdown-content li > ol {
            margin-top: 0.5em;
            margin-bottom: 0;
        }

        .markdown-content blockquote {
            margin: 1.5em 0;
            padding: 1em 1.5em;
            border-left: 3px solid var(--accent);
            background: var(--bg-secondary);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .markdown-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .markdown-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: var(--bg-secondary);
            padding: 0.2em 0.5em;
            border-radius: 4px;
            word-break: break-all;
        }

        .markdown-content pre {
            margin: 1.5em 0;
            padding: 1.25em 1.5em;
            background: var(--code-bg);
            border-radius: 12px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
        }

        .markdown-content pre code {
            background: none;
            padding: 0;
            color: var(--code-text);
            font-size: 0.85em;
            line-height: 1.6;
            word-break: normal;
        }

        .markdown-content hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 3em 0;
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5em 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 0.95em;
            display: block;
            overflow-x: auto;
        }

        .markdown-content th,
        .markdown-content td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content th {
            font-weight: 600;
            background: var(--bg-secondary);
        }

        .markdown-content tr:hover {
            background: var(--bg-secondary);
        }

        /* Task Lists */
        .markdown-content input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--accent);
        }

        /* Keyboard Shortcuts Hint */
        .shortcuts-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .shortcut {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shortcut kbd {
            padding: 4px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        /* Theme Toggle */
        .theme-toggle {
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }

        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        /* Mobile Overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Responsive - Tablet */
        @media (max-width: 1024px) {
            .top-bar {
                padding: 16px 32px;
            }

            .reader-container {
                padding: 48px 32px 100px;
            }

            .shortcuts-hint {
                display: none;
            }
        }

        /* Responsive - Mobile */
        @media (max-width: 768px) {
            :root {
                --outline-width: 280px;
            }

            body {
                font-size: 16px;
            }

            .app {
                grid-template-columns: 1fr;
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            .outline-panel {
                position: fixed;
                left: 0;
                top: 0;
                width: var(--outline-width);
                max-width: 85vw;
                z-index: 200;
                transform: translateX(-100%);
                box-shadow: none;
            }

            .app:not(.outline-collapsed) .outline-panel {
                transform: translateX(0);
                box-shadow: 4px 0 24px var(--shadow);
            }

            .app:not(.outline-collapsed) .mobile-overlay {
                display: block;
                opacity: 1;
            }

            .app.outline-collapsed .outline-panel {
                transform: translateX(-100%);
            }

            .main-content {
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            .top-bar {
                padding: 12px 16px;
                width: 100%;
            }

            .document-title {
                font-size: 14px;
            }

            .open-file-btn {
                padding: 10px 16px;
            }

            .open-file-btn span {
                display: none;
            }

            .open-file-btn svg {
                width: 18px;
                height: 18px;
            }

            .export-pdf-btn {
                padding: 10px 16px;
            }

            .export-pdf-btn span {
                display: none;
            }

            .export-pdf-btn svg {
                width: 18px;
                height: 18px;
            }

            .top-bar-right {
                gap: 8px;
            }

            .reader-container {
                padding: 24px 16px 80px;
                width: 100%;
                max-width: 100%;
            }

            .reader {
                width: 100%;
                max-width: 100%;
            }

            .welcome-state {
                padding: 40px 16px;
            }

            .welcome-icon {
                width: 64px;
                height: 64px;
                border-radius: 16px;
                margin-bottom: 24px;
            }

            .welcome-icon svg {
                width: 32px;
                height: 32px;
            }

            .welcome-title {
                font-size: 24px;
            }

            .welcome-subtitle {
                font-size: 15px;
                margin-bottom: 32px;
                padding: 0 8px;
            }

            .drop-zone {
                padding: 32px 20px;
                max-width: 100%;
            }

            .markdown-content {
                width: 100%;
            }

            .markdown-content h1 {
                font-size: 1.5em;
                line-height: 1.3;
            }

            .markdown-content h2 {
                font-size: 1.3em;
            }

            .markdown-content h3 {
                font-size: 1.15em;
            }

            .markdown-content h4 {
                font-size: 1.05em;
            }

            .markdown-content p,
            .markdown-content li {
                font-size: 16px;
                line-height: 1.7;
            }

            .markdown-content ul,
            .markdown-content ol {
                padding-left: 1.25em;
            }

            .markdown-content pre {
                padding: 1em;
                border-radius: 8px;
                font-size: 13px;
                margin: 1em 0;
            }

            .markdown-content blockquote {
                padding: 0.75em 1em;
                margin: 1em 0;
            }

            .markdown-content table {
                font-size: 14px;
            }

            .markdown-content th,
            .markdown-content td {
                padding: 8px 10px;
            }
        }

        /* Responsive - Small Mobile */
        @media (max-width: 480px) {
            body {
                font-size: 15px;
            }

            .top-bar {
                padding: 10px 12px;
            }

            .top-bar-left {
                gap: 10px;
            }

            .toggle-outline {
                width: 32px;
                height: 32px;
                min-width: 32px;
            }

            .toggle-outline svg {
                width: 16px;
                height: 16px;
            }

            .document-title {
                font-size: 13px;
            }

            .open-file-btn {
                padding: 8px 12px;
            }

            .reader-container {
                padding: 20px 14px 60px;
            }

            .markdown-content h1 {
                font-size: 1.4em;
            }

            .markdown-content h2 {
                font-size: 1.2em;
            }

            .markdown-content h3 {
                font-size: 1.1em;
            }

            .outline-item {
                padding: 10px 20px;
                font-size: 14px;
            }

            .outline-item.h3 { padding-left: 32px; }
            .outline-item.h4 { padding-left: 44px; }
            .outline-item.h5 { padding-left: 56px; }
            .outline-item.h6 { padding-left: 68px; }
        }
    </style>
</head>
<body>
    <div class="app outline-collapsed" id="app">
        <!-- Mobile Overlay -->
        <div class="mobile-overlay" id="mobileOverlay"></div>

        <!-- Outline Panel -->
        <aside class="outline-panel">
            <div class="outline-header">
                <span class="outline-title">Outline</span>
            </div>
            <nav class="outline-content" id="outlineContent">
                <!-- Outline items will be generated here -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="toggle-outline" id="toggleOutline" title="Toggle Outline (⌘ + /)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="15" y2="12"></line>
                            <line x1="3" y1="18" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <span class="document-title" id="documentTitle">Clarity</span>
                </div>
                <div class="top-bar-right">
                    <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                    <div class="file-input-wrapper">
                        <input type="file" class="file-input" id="fileInput" accept=".md,.markdown,.txt">
                        <button class="open-file-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            <span>Open File</span>
                        </button>
                    </div>
                    <button class="export-pdf-btn" id="exportPdfBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Export PDF</span>
                    </button>
                </div>
            </header>

            <div class="reader-container">
                <article class="reader" id="reader">
                    <!-- Welcome State -->
                    <div class="welcome-state" id="welcomeState">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </div>
                        <h1 class="welcome-title">Clarity</h1>
                        <p class="welcome-subtitle">Lightweight markdown reader for documentation browsing. Mildly useless, but delightful.</p>
                        <div class="drop-zone" id="dropZone">
                            <p class="drop-zone-text">
                                <strong>Drop your .md file here</strong><br>
                                or click to browse
                            </p>
                        </div>
                    </div>

                    <!-- Markdown Content (hidden initially) -->
                    <div class="markdown-content" id="markdownContent" style="display: none;"></div>
                </article>
            </div>
        </main>
    </div>

    <div class="shortcuts-hint">
        <span class="shortcut"><kbd>⌘</kbd> + <kbd>/</kbd> Toggle outline</span>
        <span class="shortcut"><kbd>⌘</kbd> + <kbd>O</kbd> Open file</span>
    </div>

    <script>
        // Elements
        const app = document.getElementById('app');
        const toggleOutline = document.getElementById('toggleOutline');
        const outlineContent = document.getElementById('outlineContent');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const welcomeState = document.getElementById('welcomeState');
        const markdownContent = document.getElementById('markdownContent');
        const documentTitle = document.getElementById('documentTitle');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const exportPdfBtn = document.getElementById('exportPdfBtn');
        const themeToggle = document.getElementById('themeToggle');

        // Theme toggle
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try { localStorage.setItem('clarity-theme', theme); } catch(e) {}
        }

        // Load saved theme preference (default dark)
        try {
            const saved = localStorage.getItem('clarity-theme');
            if (saved) setTheme(saved);
        } catch(e) {}

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        // Current document name for PDF export
        let currentDocName = 'document';

        // Configure marked
        marked.setOptions({
            gfm: true,
            breaks: true,
            headerIds: true
        });

        // Toggle Outline
        function toggleOutlinePanel() {
            app.classList.toggle('outline-collapsed');
        }

        toggleOutline.addEventListener('click', toggleOutlinePanel);

        // Close outline when clicking overlay (mobile)
        mobileOverlay.addEventListener('click', () => {
            app.classList.add('outline-collapsed');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === '/') {
                e.preventDefault();
                toggleOutlinePanel();
            }
            if ((e.metaKey || e.ctrlKey) && e.key === 'o') {
                e.preventDefault();
                fileInput.click();
            }
            // Close outline with Escape on mobile
            if (e.key === 'Escape' && !app.classList.contains('outline-collapsed')) {
                app.classList.add('outline-collapsed');
            }
        });

        // File Input
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        // Drop Zone
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) loadFile(file);
        });

        // Global drag and drop
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && (file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.name.endsWith('.txt'))) {
                loadFile(file);
            }
        });

        // Load File
        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                renderMarkdown(content, file.name);
            };
            reader.readAsText(file);
        }

        // Render Markdown
        function renderMarkdown(content, filename) {
            // Update title
            const nameWithoutExt = filename.replace(/\.(md|markdown|txt)$/i, '');
            documentTitle.textContent = nameWithoutExt;
            document.title = `${nameWithoutExt} — Clarity`;
            currentDocName = nameWithoutExt;

            // Render content
            const html = marked.parse(content);
            markdownContent.innerHTML = html;

            // Show content, hide welcome
            welcomeState.style.display = 'none';
            markdownContent.style.display = 'block';

            // Show export button
            exportPdfBtn.style.display = 'flex';

            // Generate outline
            generateOutline();

            // Show outline panel (but keep collapsed on mobile by default)
            if (window.innerWidth > 768) {
                app.classList.remove('outline-collapsed');
            }

            // Add IDs to headings if they don't have them
            addHeadingIds();

            // Setup scroll spy
            setupScrollSpy();
        }

        // Add IDs to headings
        function addHeadingIds() {
            const headings = markdownContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
            headings.forEach((heading, index) => {
                if (!heading.id) {
                    const text = heading.textContent.toLowerCase()
                        .replace(/[^\w\s-]/g, '')
                        .replace(/\s+/g, '-')
                        .trim();
                    heading.id = text || `heading-${index}`;
                }
            });
        }

        // Generate Outline
        function generateOutline() {
            const headings = markdownContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
            outlineContent.innerHTML = '';

            if (headings.length === 0) {
                outlineContent.innerHTML = '<p style="padding: 24px; color: var(--text-tertiary); font-size: 14px;">No headings found</p>';
                return;
            }

            headings.forEach((heading, index) => {
                const level = heading.tagName.toLowerCase();
                const link = document.createElement('a');
                link.className = `outline-item ${level}`;
                link.textContent = heading.textContent;
                link.href = `#${heading.id}`;
                link.dataset.index = index;

                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    
                    // Update active state
                    document.querySelectorAll('.outline-item').forEach(item => item.classList.remove('active'));
                    link.classList.add('active');

                    // Close outline on mobile after clicking
                    if (window.innerWidth <= 768) {
                        app.classList.add('outline-collapsed');
                    }
                });

                outlineContent.appendChild(link);
            });

            // Set first item as active
            const firstItem = outlineContent.querySelector('.outline-item');
            if (firstItem) firstItem.classList.add('active');
        }

        // Scroll Spy
        function setupScrollSpy() {
            const headings = markdownContent.querySelectorAll('h1, h2, h3, h4, h5, h6');
            const outlineItems = outlineContent.querySelectorAll('.outline-item');

            if (headings.length === 0) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        outlineItems.forEach((item) => {
                            item.classList.remove('active');
                            if (item.getAttribute('href') === `#${id}`) {
                                item.classList.add('active');
                                // Scroll outline item into view if needed
                                item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                            }
                        });
                    }
                });
            }, {
                rootMargin: '-80px 0px -80% 0px',
                threshold: 0
            });

            headings.forEach((heading) => observer.observe(heading));
        }

        // Export to PDF
        exportPdfBtn.addEventListener('click', () => {
            exportToPdf();
        });

        function exportToPdf() {
            // Create a new window for printing
            const printWindow = window.open('', '_blank');
            
            // Get the markdown content HTML
            const contentHtml = markdownContent.innerHTML;
            
            // Create the print document with styles
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>${currentDocName}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
                    <style>
                        * {
                            margin: 0;
                            padding: 0;
                            box-sizing: border-box;
                        }
                        
                        body {
                            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                            font-size: 12pt;
                            line-height: 1.6;
                            color: #1c1917;
                            padding: 0;
                            max-width: 100%;
                        }
                        
                        @page {
                            margin: 2cm;
                            size: A4;
                        }
                        
                        @media print {
                            body {
                                padding: 0;
                            }
                        }
                        
                        h1, h2, h3, h4, h5, h6 {
                            font-weight: 600;
                            margin-top: 1.5em;
                            margin-bottom: 0.5em;
                            line-height: 1.3;
                            page-break-after: avoid;
                        }
                        
                        h1 {
                            font-size: 24pt;
                            margin-top: 0;
                            padding-bottom: 0.3em;
                            border-bottom: 1px solid #e7e5e4;
                        }
                        
                        h2 { font-size: 18pt; }
                        h3 { font-size: 14pt; }
                        h4 { font-size: 12pt; }
                        h5 { font-size: 11pt; }
                        h6 { font-size: 10pt; color: #57534e; }
                        
                        p {
                            margin-bottom: 1em;
                            orphans: 3;
                            widows: 3;
                        }
                        
                        a {
                            color: #b45309;
                            text-decoration: underline;
                        }
                        
                        strong { font-weight: 600; }
                        em { font-style: italic; }
                        
                        ul, ol {
                            margin-bottom: 1em;
                            padding-left: 1.5em;
                        }
                        
                        li {
                            margin-bottom: 0.3em;
                        }
                        
                        blockquote {
                            margin: 1em 0;
                            padding: 0.75em 1em;
                            border-left: 3px solid #b45309;
                            background: #f5f5f4;
                            font-style: italic;
                            color: #57534e;
                            page-break-inside: avoid;
                        }
                        
                        blockquote p:last-child {
                            margin-bottom: 0;
                        }
                        
                        code {
                            font-family: 'JetBrains Mono', monospace;
                            font-size: 0.9em;
                            background: #f5f5f4;
                            padding: 0.2em 0.4em;
                            border-radius: 3px;
                        }
                        
                        pre {
                            margin: 1em 0;
                            padding: 1em;
                            background: #292524;
                            border-radius: 6px;
                            overflow-x: auto;
                            page-break-inside: avoid;
                        }
                        
                        pre code {
                            background: none;
                            padding: 0;
                            color: #fafaf9;
                            font-size: 9pt;
                            line-height: 1.5;
                        }
                        
                        hr {
                            border: none;
                            height: 1px;
                            background: #e7e5e4;
                            margin: 2em 0;
                        }
                        
                        img {
                            max-width: 100%;
                            height: auto;
                            page-break-inside: avoid;
                        }
                        
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin: 1em 0;
                            font-size: 10pt;
                            page-break-inside: avoid;
                        }
                        
                        th, td {
                            padding: 8px 12px;
                            text-align: left;
                            border-bottom: 1px solid #e7e5e4;
                        }
                        
                        th {
                            font-weight: 600;
                            background: #f5f5f4;
                        }
                        
                        input[type="checkbox"] {
                            margin-right: 6px;
                        }
                    </style>
                </head>
                <body>
                    ${contentHtml}
                </body>
                </html>
            `);
            
            printWindow.document.close();
            
            // Wait for fonts to load, then print
            printWindow.onload = () => {
                setTimeout(() => {
                    printWindow.print();
                }, 250);
            };
        }

        // Demo content for testing (can be removed)
        const demoContent = `# Welcome to Clarity

A beautiful, minimal markdown reader inspired by the clean aesthetics of Typora.

## Getting Started

Simply drag and drop any markdown file onto this page, or click the **Open File** button to browse your files.

### Features

Clarity offers a distraction-free reading experience with:

- **Clean Typography** — Carefully chosen fonts for optimal readability
- **Outline Panel** — Navigate your document structure with ease
- **Keyboard Shortcuts** — Quick access to common actions
- **Responsive Design** — Works beautifully on any device

### Supported Syntax

Clarity supports all standard markdown syntax:

#### Text Formatting

You can use **bold**, *italic*, and \`inline code\`. You can also use ~~strikethrough~~ text.

#### Code Blocks

\`\`\`javascript
function greet(name) {
    console.log(\`Hello, \${name}!\`);
}

greet('World');
\`\`\`

#### Blockquotes

> "The best interface is no interface."
> — Golden Krishna

#### Lists

1. First ordered item
2. Second ordered item
   - Nested unordered item
   - Another nested item
3. Third ordered item

#### Tables

| Feature | Status |
|---------|--------|
| Markdown Parsing | ✓ |
| Outline Panel | ✓ |
| Scroll Spy | ✓ |
| Responsive | ✓ |

---

## Keyboard Shortcuts

- \`⌘ + /\` — Toggle the outline panel
- \`⌘ + O\` — Open a file

## About

Clarity is designed to help you focus on what matters most: reading and understanding your content.

---

*Drop your own markdown file to get started.*
`;

        // Load demo content button (optional - for testing)
        dropZone.addEventListener('dblclick', () => {
            renderMarkdown(demoContent, 'Welcome.md');
        });
    </script>
</body>
</html>
